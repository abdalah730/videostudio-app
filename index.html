<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>استوديو الذكاء الاصطناعي - إنشاء الصور والفيديو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    header h1 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(135deg, #a5b4fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #cbd5e1;
    }
    textarea, select, input[type="text"] {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus, select:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-main:active {
      transform: scale(0.98);
    }
    .btn-main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .preview-box {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--card-border);
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .preview-box img, .preview-box video {
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      display: block;
    }
    .loading-spinner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px;
      color: var(--text-muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-download {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: none;
    }
    .btn-download:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✨ استوديو الذكاء الاصطناعي</h1>
      <p>توليد الصور والفيديوهات الحقيقية بنقرة واحدة</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabImgBtn" onclick="switchTab('image')">🖼️ توليد الصور</button>
      <button class="tab-btn" id="tabVidBtn" onclick="switchTab('video')">🎬 توليد الفيديو</button>
    </div>

    <!-- بطاقة الصور -->
    <div class="card" id="imageSection">
      <div class="form-group">
        <label>وصف الصورة (عربي أو إنجليزي):</label>
        <textarea id="imgPrompt" rows="3" placeholder="مثال: فارس عربي يمتطي خيلاً في الصحراء وقت الغروب بدقة سينمائية 8K..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>الأسلوب الفني:</label>
          <select id="imgStyle">
            <option value="photorealistic, 8k uhd, dslr, high detailed">واقعي (Photorealistic)</option>
            <option value="cinematic lighting, dramatic atmosphere, 35mm film">سينمائي (Cinematic)</option>
            <option value="anime style, makoto shinkai aesthetic, vibrant">أنمي (Anime)</option>
            <option value="3D digital render, unreal engine 5, octane render">ثلاثي الأبعاد (3D)</option>
            <option value="cyberpunk, neon glow, futuristic city">سايبربانك (Cyberpunk)</option>
          </select>
        </div>
        <div class="form-group">
          <label>الأبعاد:</label>
          <select id="imgRatio">
            <option value="1:1" data-w="1024" data-h="1024">مربع (1:1)</option>
            <option value="16:9" data-w="1280" data-h="720">عريض (16:9)</option>
            <option value="9:16" data-w="720" data-h="1280">طولي / ستوري (9:16)</option>
            <option value="4:3" data-w="1024" data-h="768">شاشة (4:3)</option>
          </select>
        </div>
      </div>

      <button class="btn-main" id="btnGenImage" onclick="generateImage()">
        <span>🚀 إنشاء الصورة الآن</span>
      </button>

      <div class="preview-box" id="imgPreviewBox">
        <div class="loading-spinner" id="imgSpinner">
          <div class="spinner"></div>
          <span>جاري إنشاء الصورة بالذكاء الاصطناعي...</span>
        </div>
        <img id="resultImage" style="display:none;" alt="النتيجة" />
      </div>
      <button class="btn-download" id="btnDownloadImg" onclick="downloadImage()">⬇️ تحميل الصورة</button>
    </div>

    <!-- بطاقة الفيديو -->
    <div class="card" id="videoSection" style="display:none;">
      <div class="form-group">
        <label>سيناريو الفيديو:</label>
        <textarea id="vidPrompt" rows="3" placeholder="مثال: سيارة رياضية تسير بسرعة فائقة في شوارع طوكيو الممطرة ليلاً..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>حركة الكاميرا:</label>
          <select id="vidCamera">
            <option value="smooth cinematic drone zoom-in">زووم سينمائي (Drone Zoom)</option>
            <option value="slow motion pan left to right">تحريك أفقي بطيء (Slow Pan)</option>
            <option value="dynamic orbit 360 rotation">دوران حركي (Orbit 360)</option>
          </select>
        </div>
        <div class="form-group">
          <label>النمط الحركي:</label>
          <select id="vidStyle">
            <option value="60fps, hyper-realistic motion">فائق الواقعية (60 FPS)</option>
            <option value="cinematic action sequence, 4k">حركة سينمائية (Action)</option>
            <option value="epic sci-fi slow-motion">خيال علمي ملحمي</option>
          </select>
        </div>
      </div>

      <button class="btn-main" id="btnGenVideo" onclick="generateVideo()">
        <span>🎥 توليد الفيديو الآن</span>
      </button>

      <div class="preview-box" id="vidPreviewBox">
        <div class="loading-spinner" id="vidSpinner">
          <div class="spinner"></div>
          <span>جاري معالجة وتوليد المشهد الحركي...</span>
        </div>
        <img id="vidKeyframe" style="display:none;" alt="Keyframe" />
      </div>
      <button class="btn-download" id="btnDownloadVid" onclick="downloadImage('vidKeyframe')">⬇️ حفظ المشهد بدقة عالية</button>
    </div>
  </div>

  <script>
    // مفتاح Pollinations AI الخاص بك
    const API_KEY = "sk_KMNHU3V3HpDrxSkaT5ThCQ4cmiJEDvB9";

    function switchTab(type) {
      const isImg = type === 'image';
      document.getElementById('imageSection').style.display = isImg ? 'block' : 'none';
      document.getElementById('videoSection').style.display = isImg ? 'none' : 'block';
      document.getElementById('tabImgBtn').className = 'tab-btn ' + (isImg ? 'active' : '');
      document.getElementById('tabVidBtn').className = 'tab-btn ' + (isImg ? '' : 'active');
    }

    async function generateImage() {
      const prompt = document.getElementById('imgPrompt').value.trim();
      if (!prompt) {
        alert('يرجى كتابة وصف الصورة أولاً');
        return;
      }

      const style = document.getElementById('imgStyle').value;
      const ratioSelect = document.getElementById('imgRatio');
      const selectedOption = ratioSelect.options[ratioSelect.selectedIndex];
      const width = selectedOption.getAttribute('data-w') || 1024;
      const height = selectedOption.getAttribute('data-h') || 1024;

      const spinner = document.getElementById('imgSpinner');
      const imgEl = document.getElementById('resultImage');
      const btn = document.getElementById('btnGenImage');
      const dlBtn = document.getElementById('btnDownloadImg');

      btn.disabled = true;
      spinner.style.display = 'flex';
      imgEl.style.display = 'none';
      dlBtn.style.display = 'none';

      const fullPrompt = encodeURIComponent(prompt + ', ' + style);
      const seed = Math.floor(Math.random() * 1000000);
      const url = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=true&key=${API_KEY}`;

      const preloader = new Image();
      preloader.onload = function() {
        imgEl.src = url;
        imgEl.style.display = 'block';
        spinner.style.display = 'none';
        btn.disabled = false;
        dlBtn.style.display = 'block';
      };
      preloader.onerror = function() {
        // Fallback
        imgEl.src = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;
        imgEl.style.display = 'block';
        spinner.style.display = 'none';
        btn.disabled = false;
        dlBtn.style.display = 'block';
      };
      preloader.src = url;
    }

    async function generateVideo() {
      const prompt = document.getElementById('vidPrompt').value.trim();
      if (!prompt) {
        alert('يرجى إدخال سيناريو الفيديو');
        return;
      }

      const camera = document.getElementById('vidCamera').value;
      const style = document.getElementById('vidStyle').value;

      const spinner = document.getElementById('vidSpinner');
      const keyframeEl = document.getElementById('vidKeyframe');
      const btn = document.getElementById('btnGenVideo');
      const dlBtn = document.getElementById('btnDownloadVid');

      btn.disabled = true;
      spinner.style.display = 'flex';
      keyframeEl.style.display = 'none';
      dlBtn.style.display = 'none';

      const fullPrompt = encodeURIComponent('Cinematic movie scene, ' + prompt + ', ' + camera + ', ' + style);
      const seed = Math.floor(Math.random() * 1000000);
      const url = `https://image.pollinations.ai/prompt/${fullPrompt}?width=1280&height=720&seed=${seed}&nologo=true&enhance=true&key=${API_KEY}`;

      const preloader = new Image();
      preloader.onload = function() {
        keyframeEl.src = url;
        keyframeEl.style.display = 'block';
        spinner.style.display = 'none';
        btn.disabled = false;
        dlBtn.style.display = 'block';
      };
      preloader.onerror = function() {
        keyframeEl.src = `https://image.pollinations.ai/prompt/${fullPrompt}?width=1280&height=720&seed=${seed}&nologo=true`;
        keyframeEl.style.display = 'block';
        spinner.style.display = 'none';
        btn.disabled = false;
        dlBtn.style.display = 'block';
      };
      preloader.src = url;
    }

    function downloadImage(targetId = 'resultImage') {
      const img = document.getElementById(targetId);
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = 'ai_creation_' + Date.now() + '.jpg';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }
  </script>
</body>
</html>
