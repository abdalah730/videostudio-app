<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionCraft AI Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: #121826;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            color: #a855f7;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 12px;
            color: #9ca3af;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #e5e7eb;
        }
        .input-group textarea {
            width: 100%;
            height: 100px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .generate-btn:hover {
            opacity: 0.9;
        }
        .result-section {
            margin-top: 20px;
            text-align: center;
        }
        .preview-box {
            width: 100%;
            height: 250px;
            background: #1f2937;
            border-radius: 12px;
            border: 1px dashed #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .loading {
            display: none;
            color: #c084fc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>VisionCraft AI Studio</h1>
            <p>توليد الصور والفيديوهات السينمائية الحقيقية</p>
        </div>

        <div class="input-group">
            <label>فكرة الفيديو أو الصورة السينمائية:</label>
            <textarea id="promptInput" placeholder="اكتب وصفاً تفصيلياً لما تريد توليده، مثل: منظر طبيعي ساحر لجبال وسحب متحركة..."></textarea>
        </div>

        <button class="generate-btn" onclick="generateAIContent()">توليد المحتوى بالذكاء الاصطناعي</button>

        <div class="result-section">
            <div class="preview-box">
                <span id="loadingText" class="loading">جاري التوليد بواسطة الذكاء الاصطناعي... ⏳</span>
                <img id="resultImage" alt="النتيجة المولدة">
            </div>
        </div>
    </div>

    <script>
        // مفتاح الربط الخاص بك المشفر والجاهز
        const POLLINATIONS_API_KEY = "Sk_KMNHU3V3HpDrxSkaT5ThCQ4cmiJEDvB9";

        async function generateAIContent() {
            const promptInput = document.getElementById('promptInput').value.trim();
            const loadingText = document.getElementById('loadingText');
            const resultImage = document.getElementById('resultImage');

            if (!promptInput) {
                alert("الرجاء كتابة وصف في الحقل أولاً!");
                return;
            }

            // إظهار حالة التحميل وإخفاء الصورة القديمة
            loadingText.style.display = "block";
            resultImage.style.display = "none";

            try {
                // تجهيز النص للرابط
                const encodedPrompt = encodeURIComponent(promptInput);
                
                // رابط جلب الصورة الحقيقي مع دمج المفتاح الخاص بك
                const finalImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&key=${POLLINATIONS_API_KEY}`;

                // تحميل الصورة للتأكد من جهوزيتها
                resultImage.src = finalImageUrl;
                
                resultImage.onload = () => {
                    loadingText.style.display = "none";
                    resultImage.style.display = "block";
                };

                resultImage.onerror = () => {
                    loadingText.style.display = "none";
                    alert("حدث خطأ أثناء الاتصال بخادم التوليد. تأكد من صحة المفتاح أو المحاولة لاحقاً.");
                };

            } catch (error) {
                loadingText.style.display = "none";
                console.error("خطأ:", error);
                alert("فشلت عملية الاتصال.");
            }
        }
    </script>
</body>
</html>
